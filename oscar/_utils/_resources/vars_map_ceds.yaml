# ==============================================================================
# OSCAR CEDS TRANSLATION REGISTRY (Wide Format)
# ==============================================================================
# Final Element in list is the Expected CEDS/RESCUE Unit for validation.
# C: 12.011 | O: 15.999 | N: 14.007 | S: 32.06 | H: 1.008
# Units in source: Mt for main species | kt for halogens
# Target units: PgC, TgN, TgS, Tg species, Gg species
# ==============================================================================

# 1. Standard Emissions (Regional)
# Format: "CEDS_Variable": ["OSCAR_VAR", "OSCAR_ID", "Calculation", "Expected_Unit"]
