  D_EESC: {sci_name: "ΔEESC", latex_name: '\Delta \mathrm{EESC}', long_name: "Change in equivalent effective stratospheric chlorine",     unit: "ppt"}
  
  r_hv:   {sci_name: "ρ_hν",  latex_name: '\rho_{h\nu}',             long_name: "Stratospheric sink intensity (relative to preindustrial)",  unit: "1"}


