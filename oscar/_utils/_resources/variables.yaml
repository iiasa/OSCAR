# ==============================================================================
# OSCAR VARIABLE REGISTRY
# ==============================================================================
# DESIGN PHILOSOPHY:
# This file centralizes all scientific metadata (scientific names, long names, 
# and units) away from the physical core engine (_core/).
#
# LONG-TERM ADVANTAGES:
# 1. Separation of Concerns: Physics equations stay in _core/, while reporting 
#    standards (CF-Conventions) stay here.
# 2. Interoperability: To adopt a new standard (e.g., CMIP7), you can simply 
#    swap this file for a 'cmip7_standard.yaml' without touching the physics.
# 3. Maintainability: Non-Python experts can update variable descriptions 
#    without risking bugs in the numerical solver.
# 
# Format: code_name: {sci_name: "Symbol", long_name: "Full Name", unit: "Unit"}
# ==============================================================================

variables:

  # ============================================================================
  # CLIMATE RESPONSE  [OSCAR_clim]
  # ============================================================================

  D_Tg:    {sci_name: "ΔTg",   latex_name: '\Delta T_g',     long_name: "Global mean surface temperature change",             unit: "K"}
  d_Tg:    {sci_name: "δTg",   latex_name: '\delta T_g',     long_name: "Speed of global mean surface temperature change",    unit: "K yr-1"}  
  D_Tl:    {sci_name: "ΔTl",   latex_name: '\Delta T_l',     long_name: "Regional mean surface temperature change",           unit: "K"}
  D_Td:    {sci_name: "ΔTd",   latex_name: '\Delta T_d',     long_name: "Deep ocean temperature change",                      unit: "K"}

  EEI:     {sci_name: "EEI",   latex_name: '\mathrm{EEI}',   long_name: "Earth energy imbalance",                             unit: "W yr m-2"}
  D_OHC:   {sci_name: "OHC",   latex_name: '\mathrm{OHC}',   long_name: "Ocean heat content",                                 unit: "W yr m-2"}
  d_OHC:   {sci_name: "OHU",   latex_name: '\mathrm{OHU}',   long_name: "Ocean heat uptake",                                  unit: "W m-2"}

  D_Pg:    {sci_name: "ΔPg",   latex_name: '\Delta P_g',     long_name: "Global mean precipitation change",                   unit: "mm yr-1"}
  D_Pl:    {sci_name: "ΔPl",   latex_name: '\Delta P_l',     long_name: "Regional mean precipitation change",                 unit: "mm yr-1"}
  r_Pl:    {sci_name: "ρ_Pl",  latex_name: '\rho P_l',       long_name: "Relative change in regional mean precipitation",     unit: "mm yr-1"}

  lambda:  {sci_name: "λ",     latex_name: '\lambda',        long_name: "Climate feedback factor",                            unit: "W m-2 K-1"}


  # ============================================================================
  # EFFECTIVE RADIATIVE FORCING  [OSCAR_ERF, OSCAR_ERF_wmghg, OSCAR_ERF_slcf, OSCAR_ERF_albedo]
  # ============================================================================

  ERF:        {sci_name: "ERF",  latex_name: '\mathrm{ERF}',   long_name: "Total effective radiative forcing",  unit: "W m-2"}

  ERF_wmghg:  {sci_name: "ERF_wmghg",   latex_name: '\mathrm{ERF}_\mathrm{wmghg}',    long_name: "ERF from all well-mixed greenhouse gases",            unit: "W m-2"}
  ERF_CO2:    {sci_name: "ERF_CO2",     latex_name: '\mathrm{ERF}_\mathrm{CO_2}',     long_name: "ERF from CO2",                                        unit: "W m-2"}
  ERF_CH4:    {sci_name: "ERF_CH4",     latex_name: '\mathrm{ERF}_\mathrm{CH_4}',     long_name: "ERF from CH4",                                        unit: "W m-2"}
  ERF_N2O:    {sci_name: "ERF_N2O",     latex_name: '\mathrm{ERF}_\mathrm{N_2O}',     long_name: "ERF from N2O",                                        unit: "W m-2"}
  ERF_halo:   {sci_name: "ERF_halo",    latex_name: '\mathrm{ERF}_\mathrm{halo}',     long_name: "ERF from all halogenated species",                    unit: "W m-2"}
  ERF_nonCO2: {sci_name: "ERF_nonCO2",  latex_name: '\mathrm{ERF}_\mathrm{non-CO_2}', long_name: "ERF from all non-CO2 well-mixed greenhouse gases",    unit: "W m-2"}

  ERF_O3:     {sci_name: "ERF_O3",    latex_name: '\mathrm{ERF}_\mathrm{O_3}',   long_name: "ERF from tropospheric and stratospheric ozone",    unit: "W m-2"}
  ERF_swv:    {sci_name: "ERF_swv",   latex_name: '\mathrm{ERF}_\mathrm{swv}',   long_name: "ERF from stratospheric water vapor",               unit: "W m-2"}
  ERF_ari:    {sci_name: "ERF_ari",   latex_name: '\mathrm{ERF}_\mathrm{ari}',   long_name: "ERF from aerosol-radiation interactions",          unit: "W m-2"}
  ERF_aci:    {sci_name: "ERF_aci",   latex_name: '\mathrm{ERF}_\mathrm{aci}',   long_name: "ERF from aerosol-cloud interactions",              unit: "W m-2"}
  ERF_aer:    {sci_name: "ERF_aer",   latex_name: '\mathrm{ERF}_\mathrm{aer}',   long_name: "ERF from all aerosol effects",                     unit: "W m-2"}

  ERF_lcc:    {sci_name: "ERF_lcc",   latex_name: '\mathrm{ERF}_\mathrm{lcc}',   long_name: "ERF from land-cover change albedo effect",                   unit: "W m-2"}
  ERF_luc:    {sci_name: "ERF_luc",   latex_name: '\mathrm{ERF}_\mathrm{luc}',   long_name: "ERF from land-cover change albedo effect and irrigation",    unit: "W m-2"}
  ERF_lap:    {sci_name: "ERF_lap",   latex_name: '\mathrm{ERF}_\mathrm{lap}',   long_name: "ERF from light-absorbing particles on snow and ice",         unit: "W m-2"}


  # ============================================================================
  # ATMOSPHERIC CONCENTRATIONS  [OSCAR_CO2, OSCAR_CH4, OSCAR_N2O, OSCAR_halo, OSCAR_H2]
  # ============================================================================

  CO2:    {sci_name: "CO2",   latex_name: 'X_\mathrm{CO_2}',          long_name: "Atmospheric CO2 concentration",           unit: "ppm"}
  D_CO2:  {sci_name: "ΔCO2",  latex_name: '\Delta X_\mathrm{CO_2}',   long_name: "Atmospheric CO2 concentration change",    unit: "ppm"}
  AF:     {sci_name: "AF",    latex_name: '\mathrm{AF}',              long_name: "Airborne fraction of CO2 emissions",      unit: "1"}
  kS:     {sci_name: "kS",    latex_name: 'k_S',                      long_name: "Carbon sinks rate",                       unit: "yr-1"}

  CH4:      {sci_name: "CH4",      latex_name: 'X_\mathrm{CH_4}',          long_name: "Atmospheric CH4 concentration",             unit: "ppb"}
  D_CH4:    {sci_name: "ΔCH4",     latex_name: '\Delta X_\mathrm{CH_4}',   long_name: "Atmospheric CH4 concentration change",      unit: "ppb"}
  tau_CH4:  {sci_name: "τ_CH4",    latex_name: '\tau_\mathrm{CH_4}',       long_name: "Atmospheric CH4 lifetime",                  unit: "yr"}

  N2O:      {sci_name: "N2O",      latex_name: 'X_\mathrm{N_2O}',          long_name: "Atmospheric N2O concentration",             unit: "ppb"}
  D_N2O:    {sci_name: "ΔN2O",     latex_name: '\Delta X_\mathrm{N_2O}',   long_name: "Atmospheric N2O concentration change",      unit: "ppb"}
  tau_N2O:  {sci_name: "τ_N2O",    latex_name: '\tau_\mathrm{N_2O}',       long_name: "Atmospheric N2O lifetime",                  unit: "yr"}

  Xhalo:      {sci_name: "Xhalo",       latex_name: 'X_\mathrm{halo}',             long_name: "Atmospheric halogenated species concentration",         unit: "ppt"}
  D_Xhalo:    {sci_name: "ΔXhalo",      latex_name: '\Delta X_\mathrm{halo}',      long_name: "Atmospheric halogenated species concentration change",  unit: "ppt"}
  tau_Xhalo:  {sci_name: "τ_halo",      latex_name: '\tau_\mathrm{halo}',          long_name: "Atmospheric halogenated species lifetime",              unit: "yr"}

  H2:       {sci_name: "H2",        latex_name: 'X_\mathrm{H_2}',              long_name: "Atmospheric H2 concentration",               unit: "ppb"}
  D_H2:     {sci_name: "ΔH2",      latex_name: '\Delta X_\mathrm{H_2}',        long_name: "Atmospheric H2 concentration change",        unit: "ppb"}
  tau_H2:   {sci_name: "τ_H2",     latex_name: '\tau_\mathrm{H_2}',            long_name: "Atmospheric H2 lifetime",                    unit: "yr"}


  # ============================================================================
  # CARBON DIOXIDE BUDGET  [OSCAR_CO2]
  # ============================================================================

  D_Fsink_CO2: {sci_name: "ΔFsink_CO2",  latex_name: '\Delta F_\mathrm{sink,CO_2}',  long_name: "Total CO2 uptake",                                    unit: "PgC yr-1"}
  D_Focean:    {sci_name: "ΔFocean",     latex_name: '\Delta F_\mathrm{ocean}',      long_name: "Net ocean carbon uptake flux",                        unit: "PgC yr-1"}
  D_Fland:     {sci_name: "ΔFland",      latex_name: '\Delta F_\mathrm{land}',       long_name: "Net land carbon uptake flux excluding permafrost",    unit: "PgC yr-1"}
  D_Fland_pf:  {sci_name: "ΔFland+pf",   latex_name: '\Delta F_\mathrm{land+pf}',    long_name: "Net land carbon uptake flux including permafrost",    unit: "PgC yr-1"}
  D_Frss:      {sci_name: "ΔFrss",       latex_name: '\Delta F_\mathrm{rss}',        long_name: "Replaced land carbon sources and sinks",              unit: "PgC yr-1"}
  D_Eluc:      {sci_name: "ΔEluc",       latex_name: '\Delta E_\mathrm{luc}',        long_name: "CO2 emissions from land-use change",                  unit: "PgC yr-1"}
  D_Foxi_CH4:  {sci_name: "ΔFoxi_CH4",   latex_name: '\Delta F_\mathrm{oxi,CH_4}',   long_name: "Net CO2 flux from geological CH4 oxidation",          unit: "PgC yr-1"}


  # ============================================================================
  # METHANE BUDGET  [OSCAR_CH4]
  # ============================================================================

  D_Fsink_CH4:  {sci_name: "ΔFsink_CH4",  latex_name: '\Delta F_\mathrm{sink,CH_4}',  long_name: "Change in CH4 atmospheric sink",  unit: "TgC yr-1"}


  # ============================================================================
  # NITROUS OXIDE BUDGET  [OSCAR_N2O]
  # ============================================================================

  D_Fsink_N2O:  {sci_name: "ΔFsink_N2O",  latex_name: '\Delta F_\mathrm{sink,N_2O}',  long_name: "Change in N2O atmospheric sink",  unit: "TgN yr-1"}


  # ============================================================================
  # HYDROGEN BUDGET  [OSCAR_H2]
  # ============================================================================

  D_Fsink_H2:   {sci_name: "ΔFsink_H2",   latex_name: '\Delta F_\mathrm{sink,H_2}',  long_name: "Change in H2 atmospheric sink",          unit: "TgH2 yr-1"}
  D_Fprod_H2:   {sci_name: "ΔFprod_H2",   latex_name: '\Delta F_\mathrm{prod,H_2}',  long_name: "Change in H2 photochemical production",  unit: "TgH2 yr-1"}


  # ============================================================================
  # LAND CARBON  [OSCAR_landC]
  # ============================================================================

  Aland:  {sci_name: "Aland", latex_name: 'A_\mathrm{land}', long_name: "Land biome area",                              unit: "Mha"}

  Cland:  {sci_name: "Cland", latex_name: 'C_\mathrm{land}', long_name: "Total land carbon pool excluding permafrost",  unit: "PgC"}
  Cveg:   {sci_name: "Cveg",  latex_name: 'C_\mathrm{veg}',  long_name: "Vegetation carbon pool",                       unit: "PgC"}
  Ccwd:   {sci_name: "Ccwd",  latex_name: 'C_\mathrm{cwd}',  long_name: "Coarse woody debris carbon pool",              unit: "PgC"}
  Csoil:  {sci_name: "Csoil", latex_name: 'C_\mathrm{soil}', long_name: "Soil carbon pool",                             unit: "PgC"}
  Chwp:   {sci_name: "Chwp",  latex_name: 'C_\mathrm{hwp}',  long_name: "Harvested wood products carbon pool",          unit: "PgC"}

  NPP:    {sci_name: "NPP",  latex_name: '\mathrm{NPP}',     long_name: "Net primary productivity",                     unit: "PgC yr-1"}
  NPPa:   {sci_name: "NPPa",  latex_name: '\mathrm{NPP}_a',  long_name: "Apparent net primary productivity",            unit: "PgC yr-1"}
  Efire:  {sci_name: "Efire", latex_name: 'E_\mathrm{fire}', long_name: "Wildfire carbon emissions",                    unit: "PgC yr-1"}
  Eresp:  {sci_name: "Eresp", latex_name: 'E_\mathrm{resp}', long_name: "Heterotrophic respiration",                    unit: "PgC yr-1"}
  Ehwp:   {sci_name: "Ehwp",  latex_name: 'E_\mathrm{hwp}',  long_name: "Emissions from harvested wood products",       unit: "PgC yr-1"}


  # ============================================================================
  # OCEAN CARBON  [OSCAR_oceanC]
  # ============================================================================

  D_Cocean: {sci_name: "ΔCocean", latex_name: '\Delta C_\mathrm{ocean}', long_name: "Change in total ocean carbon pool",                 unit: "PgC"}
  D_Csurf:  {sci_name: "ΔCsurf",  latex_name: '\Delta C_\mathrm{surf}',  long_name: "Change in surface ocean carbon pool",               unit: "PgC"}
  D_Cdeep:  {sci_name: "ΔCdeep",  latex_name: '\Delta C_\mathrm{deep}',  long_name: "Change in deep ocean carbon pool",                  unit: "PgC"}

  D_Fcirc:  {sci_name: "ΔFcirc",  latex_name: '\Delta F_\mathrm{circ}',  long_name: "Change in carbon flux from surface to deep ocean",  unit: "PgC yr-1"}


  # ============================================================================
  # PERMAFROST  [OSCAR_permafrost]
  # ============================================================================

  D_pthaw:  {sci_name: "Δpthaw",    latex_name: '\Delta p_\mathrm{thaw}',    long_name: "Change in thawed permafrost carbon fraction",    unit: "1"}

  D_Cthaw:  {sci_name: "ΔCthaw",    latex_name: '\Delta C_\mathrm{thaw}',    long_name: "Change in thawed permafrost carbon pool",      unit: "PgC"}
  D_Cfroz:  {sci_name: "ΔCfroz",    latex_name: '\Delta C_\mathrm{froz}',    long_name: "Change in frozen permafrost carbon pool",      unit: "PgC"}
  Cperm:    {sci_name: "Cperm",     latex_name: '\Delta C_\mathrm{perm}',    long_name: "Total permafrost carbon pool",                 unit: "PgC"}

  D_Epf:     {sci_name: "ΔEpf",      latex_name: '\Delta E_\mathrm{pf}',      long_name: "Total carbon emissions from permafrost",  unit: "PgC yr-1"}
  D_Epf_CO2: {sci_name: "ΔEpf_CO2", latex_name: '\Delta E_\mathrm{pf,CO_2}', long_name: "CO2 emissions from permafrost",           unit: "PgC yr-1"}
  D_Epf_CH4: {sci_name: "ΔEpf_CH4", latex_name: '\Delta E_\mathrm{pf,CH_4}', long_name: "CH4 emissions from permafrost",           unit: "TgC yr-1"}


  # ============================================================================
  # WETLANDS  [OSCAR_wetland]
  # ============================================================================

  Ewet:       {sci_name: "Ewet",     latex_name: 'E_\mathrm{wet}',          long_name: "Total wetland CH4 emissions",        unit: "TgC yr-1"}
  D_Ewet:     {sci_name: "ΔEwet",    latex_name: '\Delta E_\mathrm{wet}',   long_name: "Change in wetland CH4 emissions",    unit: "TgC yr-1"}
  D_Awet:     {sci_name: "ΔAwet",    latex_name: '\Delta A_\mathrm{wet}',   long_name: "Change in wetland extent",           unit: "Mha"}


  # ============================================================================
  # BIOMASS BURNING  [OSCAR_fire]
  # ============================================================================

  D_Efire:    {sci_name: "ΔEfire",   latex_name: '\Delta E_\mathrm{fire}',    long_name: "Change in wildfire carbon emissions",      unit: "PgC yr-1"}

  Ebb_CH4:    {sci_name: "Ebb_CH4",  latex_name: 'E_\mathrm{bb,CH_4}',        long_name: "Biomass burning CH4 emissions",            unit: "TgC yr-1"}
  Ebb_N2O:    {sci_name: "Ebb_N2O",  latex_name: 'E_\mathrm{bb,N_2O}',        long_name: "Biomass burning N2O emissions",            unit: "TgN yr-1"}
  Ebb_H2:     {sci_name: "Ebb_H2",   latex_name: 'E_\mathrm{bb,H_2}',         long_name: "Biomass burning H2 emissions",             unit: "TgH2 yr-1"}
  Ebb_BC:     {sci_name: "Ebb_BC",   latex_name: 'E_\mathrm{bb,BC}',          long_name: "Biomass burning BC emissions",             unit: "TgC yr-1"}
  Ebb_OC:     {sci_name: "Ebb_OC",   latex_name: 'E_\mathrm{bb,OC}',          long_name: "Biomass burning OC emissions",             unit: "TgC yr-1"}
  Ebb_SO2:    {sci_name: "Ebb_SO2",  latex_name: 'E_\mathrm{bb,SO_2}',        long_name: "Biomass burning SO2 emissions",            unit: "TgS yr-1"}
  Ebb_NH3:    {sci_name: "Ebb_NH3",  latex_name: 'E_\mathrm{bb,NH_3}',        long_name: "Biomass burning NH3 emissions",            unit: "TgN yr-1"}
  Ebb_NOx:    {sci_name: "Ebb_NOx",  latex_name: 'E_\mathrm{bb,NO_x}',        long_name: "Biomass burning NOx emissions",            unit: "TgN yr-1"}
  Ebb_CO:     {sci_name: "Ebb_CO",   latex_name: 'E_\mathrm{bb,CO}',          long_name: "Biomass burning CO emissions",             unit: "TgC yr-1"}
  Ebb_VOC:    {sci_name: "Ebb_VOC",  latex_name: 'E_\mathrm{bb,VOC}',         long_name: "Biomass burning VOC emissions",            unit: "Tg yr-1"}

  D_Ebb_CH4:  {sci_name: "ΔEbb_CH4", latex_name: '\Delta E_\mathrm{bb,CH_4}', long_name: "Change in biomass burning CH4 emissions",  unit: "TgC yr-1"}
  D_Ebb_N2O:  {sci_name: "ΔEbb_N2O", latex_name: '\Delta E_\mathrm{bb,N_2O}', long_name: "Change in biomass burning N2O emissions",  unit: "TgN yr-1"}
  D_Ebb_H2:   {sci_name: "ΔEbb_H2",  latex_name: '\Delta E_\mathrm{bb,H_2}',  long_name: "Change in biomass burning H2 emissions",   unit: "TgH2 yr-1"}
  D_Ebb_BC:   {sci_name: "ΔEbb_BC",  latex_name: '\Delta E_\mathrm{bb,BC}',   long_name: "Change in biomass burning BC emissions",   unit: "TgC yr-1"}
  D_Ebb_OC:   {sci_name: "ΔEbb_OC",  latex_name: '\Delta E_\mathrm{bb,OC}',   long_name: "Change in biomass burning OC emissions",   unit: "TgC yr-1"}
  D_Ebb_SO2:  {sci_name: "ΔEbb_SO2", latex_name: '\Delta E_\mathrm{bb,SO_2}', long_name: "Change in biomass burning SO2 emissions",  unit: "TgS yr-1"}
  D_Ebb_NH3:  {sci_name: "ΔEbb_NH3", latex_name: '\Delta E_\mathrm{bb,NH_3}', long_name: "Change in biomass burning NH3 emissions",  unit: "TgN yr-1"}
  D_Ebb_NOx:  {sci_name: "ΔEbb_NOx", latex_name: '\Delta E_\mathrm{bb,NO_x}', long_name: "Change in biomass burning NOx emissions",  unit: "TgN yr-1"}
  D_Ebb_CO:   {sci_name: "ΔEbb_CO",  latex_name: '\Delta E_\mathrm{bb,CO}',   long_name: "Change in biomass burning CO emissions",   unit: "TgC yr-1"}
  D_Ebb_VOC:  {sci_name: "ΔEbb_VOC", latex_name: '\Delta E_\mathrm{bb,VOC}',  long_name: "Change in biomass burning VOC emissions",  unit: "Tg yr-1"}


  # ============================================================================
  # NATURAL EMISSIONS  [OSCAR_NatEm]
  # ============================================================================

  Enat_BVOC:   {sci_name: "Enat_BVOC",  latex_name: 'E_\mathrm{nat,BVOC}',         long_name: "Biogenic VOC emissions",              unit: "Tg yr-1"}
  Enat_LNOx:   {sci_name: "Enat_LNOx",  latex_name: 'E_\mathrm{nat,LNO_x}',        long_name: "Lightning NOx emissions",             unit: "TgN yr-1"}
  Enat_DMS:    {sci_name: "Enat_DMS",   latex_name: 'E_\mathrm{nat,DMS}',          long_name: "Oceanic DMS emissions",               unit: "TgS yr-1"}
  Edust:       {sci_name: "Edust",      latex_name: 'E_\mathrm{dust}',             long_name: "Mineral dust emissions",              unit: "Tg yr-1"}
  Esalt:       {sci_name: "Esalt",      latex_name: 'E_\mathrm{salt}',             long_name: "Sea salt emissions",                  unit: "Tg yr-1"}

