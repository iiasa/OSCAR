# ==========================================================
# 1. DATA & TIME REGISTRY
# ==========================================================
metadata:
  zenodo_base_url: "https://zenodo.org/api/records/"
  core_data:  { version: "v4-beta1", zenodo_id: "" }
  run_mode: { version: "v4-beta1", zenodo_id: "21822036" }
  
  # Library Horizons
  build_end: &default_end 2100  # Official library ceiling
  ext_end:   &max_end     2100  # Research extension ceiling - To be extended to 2300

required_assets:
  - "forcing_hist.nc"
  - "forcing_scen.nc"
  - "params_nMC{nMC}.nc"
  - "hist_results_nMC{nMC}.nc"
  - "ini_state_nMC{nMC}.nc"

# ==========================================================
# 2. SCIENTIFIC REGISTRY
# ==========================================================
registry:
  # Historical versions define the "Scientific Switch" year
  hist_versions:
    CMIP6: { hist_start: 1750, hist_end: 2014, scen_start: 2015 }
    CMIP7: { hist_start: 1750, hist_end: 2023, scen_start: 2024 } 

  # Variable Tiers
  v_core: &v_core ['D_Tg', 'D_CO2', 'D_CH4', 'D_N2O']

  # Spatial & Scenario Bounds
  all_regions: &reg_all ['IAMC_R5','IAMC_R10']
  all_scens:
    scen6: &scen6 ['SSP1-1.9', 'SSP1-2.6', 'SSP2-4.5', 'SSP3-7.0', 'SSP3-7.0-LowNTCF', 'SSP4-3.4', 'SSP4-6.0', 'SSP5-3.4-OS', 'SSP5-8.5']
    scen7: &scen7 ['scen7-H', 'scen7-M','scen7-VL']


# ==========================================================
# 3. OPERATION TIERS
# ==========================================================

# TIER 0: STANDARD (Verification)
# Automated "Baseline" run
standard_mode:
  nMC: 500
  hist_type: "CMIP7"
  # Run covers the full library range
  run_range: [1750, *default_end]
  region: "IAMC_R5"
  scenarios: *scen7
  var_select: *v_core

# TIER 1: CONFIGURED (Library Builder)
configured_mode:
  official_nMC: 500
  run_end: *default_end
  allowed_hist: ["CMIP6", "CMIP7"] #NOTE: Add CMIP7 when available
  allowed_regions: *reg_all
  defaults:
    hist_type: "CMIP7"
    region: "IAMC_R5"
    scenario: ["scen7-VL"]
    var_select: ["D_Tg", "D_CO2"]

# TIER 2: CUSTOMIZED (User Research)
customized_mode:
  allowed_hist: ["CMIP6", "CMIP7"] # NOTE: Add CMIP7 when available
  allowed_years: { min: 1750, max: *max_end }
  allowed_regions: *reg_all
  marker_scenarios: ['scen7-H', 'scen7-VL']

  output_themes:
    climate: *v_core
    land: ["D_CO2", "D_Fland", "D_Eluc", "Cveg", "Csoil"]
    permafrost: ["D_Tg", "D_pthaw", "D_Cfroz", "D_Cthaw"]
    custom: null

  settings:
    preprocess_forcing: true
    plot_user_forcing: true
    run_model: true
    plot_outputs: true