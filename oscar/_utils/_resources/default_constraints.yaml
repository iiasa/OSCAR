# Formatted from Xinrui's script 'step6_constrain_lhs.py' on 2026-04-20
# Constraint specifications from RCMIP phase3
# References included for each constraint

constraints:
  - name: "D_Tg"
    # temperature constraint - normal distribution, 2014–2023
    # https://doi.org/10.5194/essd-16-2625-2024, Table 5, very likely range
    type: "normal"
    base: [1850, 1900]
    period: [2014, 2023]
    mean_eqn:  "(11.932/10)- (-0.062/51)"  #--------------------------------------- use RCMIP3 data
    # calculated from 1850-1900 mean and 2014-2023 mean, based on RCMIP3 data v1.1.1, about 1.194
    std_eqn: "(1.30 - 1.06) / 3.29"  # # 90% PI to std (assuming normal distribution)
    units: "K"

  - name: "D_CO2"
    # CO2 constraint - lognormal distribution, 2023 minus 1750 level
    # https://doi.org/10.5194/essd-17-965-2025, p969
    # https://doi.org/10.1017/9781009157896.009, p948
    type: "lognormal"
    base: [1979, 1990]  #-------------------------------------------------------- use RCMIP3 data
    period: [2023, 2023]
    mean_eqn: "419.32 - (4142.93/12)"  # ---------------------------------------- use RCMIP3 data
    std_eqn: "(419.3 - 278.38) * 0.05"  # 5% uncertainty of the total increase since 1750
    units: "ppm"

  - name: "D_CH4" # NOT included in RCMIP3
    # CH4 constraint - lognormal distribution, 2023 minus 1750 level
    # https://doi.org/10.5194/essd-16-2625-2024, Table 10
    # https://doi.org/10.1017/9781009157896.009, p948
    type: "lognormal"
    period: [2023, 2023]
    mean_eqn: "1922.5 - 729.2"
    std_eqn: "(1922.5 - 729.2) * 0.07"  # 7% uncertainty
    units: "ppb"

  - name: "D_N2O" #NOT included in RCMIP3
    # N2O constraint - lognormal distribution, 2023 minus 1750 level
    # https://doi.org/10.5194/essd-16-2625-2024, Table 10
    # https://doi.org/10.1017/9781009157896.009, p948
    type: "lognormal"
    period: [2023, 2023]
    mean_eqn: "336.9 - 270.1"
    std_eqn: "(336.9 - 270.1) * 0.25"  # 25% uncertainty
    units: "ppb"

  - name: "D_OHC"
    # OHC constraint - normal distribution, 2006–2018
    # https://doi.org/10.1017/9781009157896.009, Table 7.1, very likely range
    type: "normal"
    base: [1971, 1980]
    period: [2020, 2020]
    mean_eqn: "487.6709033-(250.825034/10)"    # ---------------------------------- use RCMIP3 data
    std_eqn: "(191.3 - 86.4) / 3.29"  # 90% PI to std (assuming normal distribution)
    units: "ZJ"

  - name: "ERF_ari"
    # aerosol-radiation RF constraint - normal distribution, 1750–2023
    # https://doi.org/10.5194/essd-17-2641-2025, Table 3
    type: "percentile"
    period: [2023, 2023]
    median: -0.26
    p5: -0.50
    p95: -0.03
    units: "W/m²"

  - name: "ERF_aci"
    # aerosol-cloud RF constraint - normal distribution, 1750–2023
    # https://doi.org/10.5194/essd-17-2641-2025, Table 3
    type: "percentile"
    period: [2023, 2023]
    median: -0.91
    p5: -1.80
    p95: -0.27
    units: "W/m²"

  - name: "D_Focean"
    # ocean carbon uptake constraint - normal distribution, 2015–2023
    # https://essd.copernicus.org/preprints/essd-2025-659/essd-2025-659.pdf, Table 7, ±1σ
    type: "normal"
    base: [1959, 1970]
    period: [2023, 2023]
    mean_eqn: "(2.88072069300471 - 13.918775478920578/12)"  #--------------------------------------- use RCMIP3 data, calculate as the mean of (2023-baseline)
    std_eqn: "((100 * 0.4**2 + 0.4**2) / 81)**0.5"    #  literature provides information for 2015-2024, correct to 2015-2023
    units: "PgC/yr"

  - name: "D_Fland"
    # land carbon uptake constraint - normal distribution, 1850–2023
    # https://essd.copernicus.org/preprints/essd-2025-659/essd-2025-659.pdf, Table 5, ±1σ
    type: "normal"
    base: [1850, 1900]  #----------------------------------------------------------------------- use RCMIP3 data
    period: [2015, 2023]
    mean_eqn: "(28.11707274100372/9 - 23.36015525/51)"  # ---------------------------------------------- use RCMIP3 data
    std_eqn: "((100 * 1**2 + 1.1**2) / 81)**0.5"       # literature provides information for 2015-2024, correct to 2015-2023
    units: "PgC/yr"

  - name: "RF_aer"
    # total AER RF constraint - normal distribution, 1750–2023
    type: "percentile"
    base: [1850, 1900]    # ------------------------------------------------------- use RCMIP3 data
    period: [2023, 2023]
    median: -0.963205957 # ------------------------------------------------------- use RCMIP3 data, calculate as the median of (RF2023-RFbaseline)
    p5: -1.08258  # ------------------------------------------------------- use RCMIP3 data, calculate as the 5th percentile of (RF2023-RFbaseline)
    p95: -0.81546 # ------------------------------------------------------- use RCMIP3 data, calculate as the 95th percentile of (RF2023-RFbaseline)
    units: "W/m²"