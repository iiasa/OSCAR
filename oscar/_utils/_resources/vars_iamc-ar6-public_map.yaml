# 1. Standard Emissions (Regional)
# Format: "IAMC_Name": ["OSCAR_VAR", "OSCAR_ID", "Calculation", "Expected_Unit"]
emissions:
  # Standard Species (OSCAR_VAR == OSCAR_ID)
  "Emissions|CO2|Energy and Industrial Processes": ["D_Eff", "D_Eff", "(12.011 / 44.009) / 1000", "Mt CO2/yr"]
  "Emissions|CO2|AFOLU": ["D_Eluc", "D_Eluc", "(12.011 / 44.009) / 1000", "Mt CO2/yr"]
  # Note: need to set internal biomass burning emissions to 0 for non-CO2 to be correct
  "Emissions|CH4": ["D_Eant_CH4", "D_Eant_CH4", "12.011 / 16.043", "Mt CH4/yr"]
  "Emissions|N2O": ["D_Eant_N2O", "D_Eant_N2O", "(28.014 / 44.013) / 1000", "kt N2O/yr"]
  "Emissions|NOx": ["D_Eant_NOX", "D_Eant_NOX", "14.007 / 46.005", "Mt NO2/yr"]
  "Emissions|Sulfur": ["D_Eant_SO2", "D_Eant_SO2", "32.06 / 64.06", "Mt SO2/yr"]
