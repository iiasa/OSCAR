[project]
name = "oscar"
dynamic = ["version"]
description = "OSCAR Earth system model"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "xarray",
  "pandas",
  "scipy",
  "matplotlib",
  "pyyaml",
  "netcdf4>=1.7.2",
  "h5netcdf>=1.8.0",
  "h5py",
  "click>=8.1.8",
  "requests>=2.32.5",
]

[project.scripts]
oscar = "oscar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.*)"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["oscar"]

[tool.hatch.build.targets.wheel.force-include]
"VERSION" = "oscar/VERSION"

[tool.pytest.ini_options]
testpaths = ["oscar_data/tests"]
cache_dir = "oscar_data/.pytest_cache"  # keep the repository root clean
python_files = ["test_*.py"]  # smoke_test.py and run_test_core.py are manual scripts
